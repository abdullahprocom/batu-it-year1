<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> التعليمية Office منصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="default" class="font-cairo">
    <div id="app-container" class="min-h-screen flex flex-col">
        <!-- Header Section -->
        <header class="shadow-lg">
            <nav class="container mx-auto p-4 flex justify-between items-center">
                <div class="logo text-2xl font-bold">
                    <i class="fas fa-school text-accent-color"></i>
                    <span> Sonix </span>
                </div>
                <div class="theme-switcher relative">
                    <button id="theme-btn" aria-label="تغيير الثيم" class="text-text-primary text-3xl transition-transform duration-300 hover:scale-110 hover:rotate-15"><i class="fas fa-palette"></i></button>
                    <div id="theme-options" class="theme-options hidden absolute top-full right-0 mt-2 p-2 rounded-lg shadow-xl flex flex-col gap-2 z-50">
                        <!-- Theme options will be dynamically loaded here by JavaScript -->
                    </div>
                </div>
            </nav>
        </header>

        <!-- Main Content Area - Screens will be displayed here -->
        <main class="flex-grow">
            <!-- Home Screen -->
            <div id="home-screen" class="screen active">
                <div class="hero text-center p-8">
                    <h1 class="text-4xl md:text-5xl font-extrabold mb-4 animate-fade-in">مرحباً بك في منصة مايكروسوفت أوفيس</h1>
                    
                </div>
                <div class="home-grid grid gap-6 p-4 max-w-7xl mx-auto">
                    <!-- Cards are rendered by JS -->
                </div>
            </div>

            <!-- Selection Screen (for Lectures, Assignments, etc.) -->
            <div id="selection-screen" class="screen">
                <button class="btn btn-secondary back-btn m-4"><i class="fas fa-arrow-right ml-2"></i> العودة</button>
                <h2 id="selection-title" class="section-title"></h2>
                <div id="selection-grid" class="content-grid grid gap-6 p-4"></div>
            </div>

            <!-- Summary Screen (for Lecture/Assignment details) -->
            <div id="summary-screen" class="screen">
                 <button class="btn btn-secondary back-btn m-4"><i class="fas fa-arrow-right ml-2"></i> العودة</button>
                <div class="content-card">
                    <h2 id="summary-title" class="text-2xl md:text-3xl font-bold text-accent-color mb-6 text-center"></h2>
                    <div class="lang-toggle flex justify-center mb-6">
                        <button id="summary-lang-ar" class="lang-btn active">عربي</button>
                        <button id="summary-lang-en" class="lang-btn">English</button>
                    </div>
                    <div id="audio-player-container" class="hidden my-6">
                         <audio id="audio-player" controls class="w-full rounded-lg shadow-md"></audio>
                    </div>
                    <div id="summary-content-ar" class="summary-content text-right"></div>
                    <div id="summary-content-en" class="summary-content text-left hidden"></div>
                    <button id="start-quiz-btn" class="btn btn-primary w-full mt-8 animate-pulse-btn">🚀 ابدأ الاختبار</button>
                </div>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="screen">
                <div class="content-card">
                    <div class="quiz-header flex justify-between items-center flex-wrap gap-4 mb-6">
                        <h2 id="quiz-title" class="text-xl md:text-2xl font-bold text-accent-color flex-grow text-right"></h2>
                        <button class="btn btn-secondary close-quiz-btn">الخروج من الاختبار <i class="fas fa-times mr-2"></i></button>
                    </div>
                    <div class="progress-bar-container w-full h-2 bg-border-color rounded-full mb-4">
                        <div id="progress-bar" class="h-full bg-accent-color rounded-full transition-all duration-300"></div>
                    </div>
                    <p id="question-counter" class="text-text-secondary text-lg mb-4 text-left"></p>
                    <p id="question-text" class="text-text-primary text-xl md:text-2xl font-semibold mb-6 text-left" dir="ltr"></p>
                    <div id="options-container" class="grid gap-4 md:grid-cols-2 lg:grid-cols-2 text-left" dir="ltr"></div>
                    <div id="hint-container" class="hint hidden">
                        <p id="hint-text"></p>
                    </div>
                    <div class="quiz-navigation flex justify-between mt-8">
                        <button id="prev-btn" class="btn btn-secondary" disabled><i class="fas fa-arrow-right ml-2"></i> السابق</button>
                        <button id="next-btn" class="btn btn-primary">التالي <i class="fas fa-arrow-left mr-2"></i></button>
                    </div>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="results-screen" class="screen">
                <div class="content-card text-center p-8">
                    <h2 class="section-title text-4xl font-extrabold text-accent-color mb-6">📊 النتيجة النهائية</h2>
                    <p id="correct-answers-p" class="text-xl md:text-2xl font-semibold text-text-primary mb-3"></p>
                    <p id="wrong-answers-p" class="text-xl md:text-2xl font-semibold text-text-primary mb-3"></p>
                    <p id="success-rate-p" class="text-3xl md:text-4xl font-bold text-accent-color my-8 animate-bounce-in"></p>
                    <div class="flex flex-col md:flex-row justify-center gap-4">
                        <button id="restart-quiz-btn" class="btn btn-primary text-lg">🔄 إعادة الاختبار</button>
                        <button class="btn btn-secondary text-lg back-to-home-btn">القائمة الرئيسية <i class="fas fa-home mr-2"></i></button>
                    </div>
                </div>
            </div>

            <!-- Video Tutorials Screen -->
            <div id="videos-screen" class="screen">
                <button class="btn btn-secondary back-btn m-4"><i class="fas fa-arrow-right ml-2"></i> العودة</button>
                <h2 class="section-title">شروحات الفيديو</h2>
                <div id="videos-grid" class="content-grid grid gap-6 p-4"></div>
            </div>

            <!-- Video Modal -->
            <div id="video-modal" class="video-modal fixed inset-0 flex items-center justify-center p-4 z-[1001] hidden">
                 <div class="video-modal-content relative w-full max-w-4xl rounded-lg shadow-2xl p-2">
                    <button class="close-btn absolute text-white text-4xl" id="close-video-modal">×</button>
                    <div class="relative pb-[56.25%] h-0 overflow-hidden rounded-md">
                        <iframe id="youtube-player" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="absolute top-0 left-0 w-full h-full"></iframe>
                    </div>
                </div>
            </div>

            <!-- Custom Modal for general messages -->
            <div id="custom-message-modal" class="modal fixed inset-0 flex items-center justify-center z-[1000] hidden">
                <div class="modal-content p-8 rounded-xl shadow-2xl text-center max-w-sm w-11/12">
                    <h3 id="modal-title" class="modal-title text-2xl font-bold mb-4"></h3>
                    <p id="modal-message" class="modal-message text-lg mb-6"></p>
                    <button class="btn modal-close-btn" id="modal-close-btn">حسناً</button>
                </div>
            </div>
        </main>

        <!-- Footer Section -->
        <footer class="p-6 text-center border-t-2">
            <p id="footer-text" class="text-lg md:text-xl font-medium">
                <!-- Name will be inserted here by JavaScript with animation -->
            </p>
            <p class="disclaimer mt-2">
                هذا الموقع هو أداة مساعدة للطلاب ولا يتبع أي جهة تعليمية بشكل رسمي.
                <br>
                To Communicate: 01285512241
                <br>
            </p>
                <br>
            <a href="https://novera.team/" > Powered By Novera Team </a>
        </footer>
    </div>

    <!-- Data and Script files -->
    <script type="module" src="data.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
